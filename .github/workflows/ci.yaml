name: CI Pipeline (VPS + Package)

on:
  push:
    branches:
      - vizcaino

# Permisos necesarios para subir el paquete a GitHub
permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      # --- FASE 1: PRUEBAS ---
      - name: Configurar Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests con pytest
        run: pytest

      # --- FASE 2: CREAR PAQUETE (IMAGEN DOCKER) ---
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir imagen Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Aquí creamos la etiqueta 1.0.1 que usa tu servidor
          tags: |
            ghcr.io/lalysita/nathalyvizcaino:1.0.1
            ghcr.io/lalysita/nathalyvizcaino:latest

      # --- FASE 3: DESPLIEGUE AL VPS ---
      - name: Pruebas de ssh con el servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: | 
            echo "Conexion exitosa desde GitHub Actions"
            whoami
            uptime

      - name: Pasar el stack.yml al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/automatizar"
        
      - name: Deploy del servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: | 
            # 1. Login en el registro (Nota: ghcr.io, no hgcr.io)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u lalysita --password-stdin

            # 2. Descargar la imagen recién creada
            docker pull ghcr.io/lalysita/nathalyvizcaino:1.0.1 
            
            # 3. Actualizar el servicio (asumiendo Docker Swarm)
            # Si usas docker-compose, cambia esto por 'docker-compose up -d'
            docker stack deploy -c /home/${{ secrets.VPS_USER }}/automatizar/stack.yml nathalyvizcaino